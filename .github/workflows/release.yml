# 推到 main 就打包、自动进一位补丁号、发 Release。
#
# 版本号规则：**只有 v2.1.xxx 的 xxx 会自动动。** 主版本和次版本（2.1）是人的
# 决定，写在 version.py 的 VERSION 里；补丁号由这个工作流数已有的 v2.1.* 标签
# 得出，取最大的那个加一。想发 2.2 就去改 VERSION 并把下面的 SERIES 一起改。
#
# **两边必须同时改。** 只改一边不会有任何报错：SERIES 留在老系列的话 CI 照旧
# 在那里递增，而从源码跑的人看到的是 version.py 里的新系列，同一份代码报两个
# 版本号。换系列时 latest 数不到本系列的标签，从 .0 开始，这是对的。
#
# 为什么不让 version.py 自己维护补丁号：那需要每次发版都回推一个提交改文件，
# 而那个提交又会触发这个工作流，自己咬自己。数标签没有这个问题——标签就是
# 已发布版本的唯一事实来源。
#
# 打包的四个：client/ 和 xplane_client/ 是早期的纯语音飞行员端，已经被 xpc/
# 和 msfs/ 取代（那两个还会登录 FSD 让飞机出现在网络上），不再出包。但它们的
# 测试照跑——共享 FREQ_* 频道约定和 Mumble 处理，回归了同样要知道。
#
# Windows 出四个包，macOS 出三个（controller / atis / xpc）。**msfs 没有 macOS
# 版是因为 Microsoft Flight Simulator 本身没有** ——SimConnect 是 Windows 的。
# XPC 有，因为 X-Plane 有 macOS 版。
#
# PyInstaller 不支持交叉编译，所以每个平台都得在自己的 runner 上打；macOS 还得
# 按 CPU 架构各打一份，Apple 芯片的包在 Intel 机器上根本起不来。想省 CI 时间的
# 话，删掉 build-macos 矩阵里 x86_64 那一行即可——Apple 从 2023 年起就不卖
# Intel Mac 了，但删了就等于不再给那批用户出包。

name: 打包与发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # 打标签、建 Release 都要写权限

# 两次推送挨得很近时会同时算出同一个补丁号，然后第二个打标签失败。
# 串行化，后面那个会重新数一遍。
concurrency:
  group: release
  cancel-in-progress: false

env:
  SERIES: "2.1"          # 自动递增只在这个系列里进行；要和 version.py 的 VERSION 同系列
  # runner 的 stdout 默认是 cp1252，而这个仓库的日志和 print 全是中文——
  # server/login.py 的 print(f"认证用户: {name}")、version.freeze() 的
  # print(f"版本 …")，都会直接 UnicodeEncodeError。测试那边表现为十几个用例
  # 一起挂、看着像认证逻辑坏了；打包那边表现为 spec 执行到一半退出。
  PYTHONUTF8: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.next.outputs.number }}   # 2.1.7
      tag: ${{ steps.next.outputs.tag }}         # v2.1.7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 要看到全部标签
      - id: next
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          # 只看本系列的标签，取补丁号最大的那个。一个都没有就从 0 开始。
          latest=$(git tag -l "v${SERIES}.*" \
                   | sed -n "s/^v${SERIES}\.\([0-9][0-9]*\)$/\1/p" \
                   | sort -n | tail -1)
          next=$(( ${latest:--1} + 1 ))
          echo "number=${SERIES}.${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${SERIES}.${next}"   >> "$GITHUB_OUTPUT"
          echo "上一个补丁号 ${latest:-（无）}，这次发 v${SERIES}.${next}"

  test:
    # 和 build 并行。测试没过就不发——release 同时依赖两者。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # PyAudio 没有 3.13+ 的 wheel
          cache: pip
          # 默认只认 requirements.txt / pyproject.toml，不指明会直接报错
          cache-dependency-path: requirements-build.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: 单元测试
        shell: pwsh
        run: |
          # opuslib 是运行时用 ctypes 加载 opus 的。组件目录里各自带了一份
          # opus.dll，但那不在 DLL 搜索路径上，CI 上 find_library 也找不到系统
          # 的——client / xplane_client / server\ATIS 的测试会在收集阶段就
          # "Could not find Opus library" 整个模块失败。pyogg 的 wheel 里带着
          # Windows 版的，指给它。
          $pyogg = python -c "import os, pyogg; print(os.path.dirname(pyogg.__file__))"
          $env:PATH = "$pyogg;$env:PATH"

          $dirs = @("atis", "client", "controller", "msfs", "server",
                    "server/ATIS", "xpc", "xplane_client")
          $failed = @()
          foreach ($d in $dirs) {
            Write-Output "::group::$d"
            Push-Location $d
            python -m unittest discover -p "test_*.py"
            if ($LASTEXITCODE -ne 0) { $failed += $d }
            Pop-Location
            Write-Output "::endgroup::"
          }
          if ($failed.Count) { throw "这些目录的测试没过: $($failed -join ', ')" }

      - name: 离屏 smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen   # CI 上没有显示器
        run: |
          $pyogg = python -c "import os, pyogg; print(os.path.dirname(pyogg.__file__))"
          $env:PATH = "$pyogg;$env:PATH"

          foreach ($d in @("atis", "controller", "client", "msfs", "xpc", "xplane_client")) {
            Write-Output "::group::$d smoke"
            Push-Location $d
            python smoke_gui.py
            if ($LASTEXITCODE -ne 0) { Pop-Location; throw "$d 的 smoke 没过" }
            Pop-Location
            Write-Output "::endgroup::"
          }

  test-macos:
    # 和 Windows 那份跑同样的用例。分开一个 job 是因为**平台差异正是这次要防的
    # 回归**：apppaths 换目录、applog 打开日志用的 open、broadcast 的 say 合成、
    # ptt 的辅助功能判定，这几条在 Windows 上永远走不到另一个分支。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # PyAudio 没有 3.13+ 的 wheel
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: 装原生库
        # macOS 上 PyAudio 没有 wheel，是从 sdist 现编的，要 portaudio 的头文件；
        # opus 则是 opuslib 运行时用 ctypes 加载的，缺了它 pymumble 一导入就死。
        run: brew install portaudio opus

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: 单元测试
        run: |
          # msfs 也跑：它和 xpc 共享 voice.py / ptt.py / theme.py 等几份逐字节
          # 相同的副本，SharedCopyTest 就是靠这一遍发现它们分了叉。
          failed=""
          for d in atis client controller msfs server server/ATIS xpc xplane_client; do
            echo "::group::$d"
            (cd "$d" && python -m unittest discover -p "test_*.py") || failed="$failed $d"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "这些目录的测试没过:$failed"; exit 1; fi

      - name: 离屏 smoke
        env:
          QT_QPA_PLATFORM: offscreen   # CI 上没有显示器
        run: |
          # **client/ 不在这里**：它用的 keyboard 那个老库在 macOS 上一 listen
          # 就抛 "Must be run as administrator"。那是个不再出包的遗留客户端，
          # 为它给 CI 加 root 不值得；它的单元测试上面照跑。
          failed=""
          for d in atis controller msfs xpc; do
            echo "::group::$d smoke"
            (cd "$d" && python smoke_gui.py) || failed="$failed $d"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "这些目录的 smoke 没过:$failed"; exit 1; fi

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false   # 一个挂了其余三个照打，一次看全问题
      matrix:
        include:
          - component: controller
            output: audio-for-can
          - component: atis
            output: atis-for-can
          - component: xpc
            output: xpc-for-can
          - component: msfs
            output: msfs-for-can

    steps:
      - uses: actions/checkout@v4
        with:
          # version.freeze() 用 git rev-list --count HEAD 当 build 号，
          # 浅克隆只有一个提交，会得出 build 1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # 默认只认 requirements.txt / pyproject.toml，不指明会直接报错
          cache-dependency-path: requirements-build.txt

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: 打包 ${{ matrix.output }}
        working-directory: ${{ matrix.component }}
        env:
          # version.freeze() 读它，写进 buildinfo.json；界面和日志显示的就是它
          AIRWAYSN_VERSION: ${{ needs.version.outputs.number }}
        # 必须在组件目录里跑：spec 里 favicon.ico、opus.dll 都是相对路径
        run: pyinstaller gui.spec --noconfirm --clean

      - name: 把 X-Plane 插件放到包的顶层
        if: matrix.component == 'xpc'
        working-directory: ${{ matrix.component }}
        shell: pwsh
        # 插件本来就随包分发（gui.spec 的 datas），但它落在 _internal/plugin/ 下，
        # 那是 PyInstaller 的运行时目录，正常用户不会去翻，README 也不好指。
        # 客户端设置里能一键装，这一份是给装不成的人手工拷的——权限不够、
        # 绿色版探测不到目录、或者 X-Plane 装在另一台机器上。
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.output }}/plugin" | Out-Null
          Copy-Item "plugin/PI_XpcTraffic.py" "dist/${{ matrix.output }}/plugin/"

      - name: 验原生库和版本号
        working-directory: ${{ matrix.component }}
        shell: pwsh
        # opus.dll 和 SimConnect.dll 是 ctypes 运行时加载的，PyInstaller 的静态
        # 分析看不见。漏了不会让打包失败，只会让用户拿到一个装上就用不了的包，
        # 所以在这里显式验一遍。
        run: |
          $root = "dist/${{ matrix.output }}/_internal"
          $missing = @()
          if (-not (Test-Path "$root/opus.dll")) { $missing += "opus.dll" }
          if (-not (Test-Path "$root/buildinfo.json")) { $missing += "buildinfo.json" }
          if ("${{ matrix.component }}" -eq "msfs" -and
              -not (Test-Path "$root/SimConnect/SimConnect.dll")) {
            $missing += "SimConnect/SimConnect.dll"
          }
          if ("${{ matrix.component }}" -eq "xpc") {
            # _internal 里那份是设置里"安装插件"按钮真正拷过去的源文件
            # （xpinstall.bundled_plugin() 走 sys._MEIPASS）。漏了的话程序照常
            # 启动，只是一点安装就报"随包的插件不见了"。
            if (-not (Test-Path "$root/plugin/PI_XpcTraffic.py")) {
              $missing += "_internal/plugin/PI_XpcTraffic.py"
            }
            # 顶层那份是给手工安装用的
            if (-not (Test-Path "dist/${{ matrix.output }}/plugin/PI_XpcTraffic.py")) {
              $missing += "plugin/PI_XpcTraffic.py"
            }
          }
          if ($missing.Count) { throw "包里缺这些运行时必需的文件: $($missing -join ', ')" }

          $info = Get-Content "$root/buildinfo.json" | ConvertFrom-Json
          if ($info.version -ne "${{ needs.version.outputs.number }}") {
            throw "包里的版本号是 $($info.version)，应当是 ${{ needs.version.outputs.number }}"
          }
          Write-Output "原生库齐全，版本 $($info.version) build $($info.build)"

      - name: 压包
        working-directory: ${{ matrix.component }}/dist
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.output }}" `
            -DestinationPath "${{ matrix.output }}-${{ needs.version.outputs.tag }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.component }}/dist/*.zip
          if-no-files-found: error

  build-macos:
    needs: version
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false   # 一个挂了其余的照打，一次看全问题
      matrix:
        component: [controller, atis, xpc]
        # 两个架构各打一份。**Apple 芯片的包在 Intel Mac 上完全起不来**，
        # 而 Intel 的包在 Apple 芯片上要走 Rosetta。想省 CI 就删掉 x86_64 那行。
        arch:
          - { runner: macos-14, name: arm64 }
          - { runner: macos-13, name: x86_64 }

    steps:
      - uses: actions/checkout@v4
        with:
          # version.freeze() 用 git rev-list --count HEAD 当 build 号，
          # 浅克隆只有一个提交，会得出 build 1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: 装原生库
        # portaudio：PyAudio 在 macOS 上没有 wheel，从 sdist 现编要它的头文件。
        # opus：gui.spec 的 find_opus() 会把它打进包里（macOS 上系统不自带）。
        run: brew install portaudio opus

      - id: names
        run: |
          case "${{ matrix.component }}" in
            controller) echo "output=audio-for-can" >> "$GITHUB_OUTPUT" ;;
            atis)       echo "output=atis-for-can"  >> "$GITHUB_OUTPUT" ;;
            xpc)        echo "output=xpc-for-can"   >> "$GITHUB_OUTPUT" ;;
          esac

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: 打包 ${{ steps.names.outputs.output }}
        working-directory: ${{ matrix.component }}
        env:
          # version.freeze() 读它，写进 buildinfo.json；界面和日志显示的就是它
          AIRWAYSN_VERSION: ${{ needs.version.outputs.number }}
        # 必须在组件目录里跑：spec 里 favicon.ico、plugin/ 都是相对路径
        run: pyinstaller gui.spec --noconfirm --clean

      - name: 把 X-Plane 插件放到包的旁边
        if: matrix.component == 'xpc'
        working-directory: ${{ matrix.component }}
        env:
          OUT: ${{ steps.names.outputs.output }}
        # 包里已经有一份（gui.spec 的 datas，落在 .app 内部，设置里"安装插件"
        # 按钮拷的就是它）。这一份在 .app 外面，是给装不成的人手工拷的。
        #
        # macOS 上 .app 是一个整体，插件没法"放在它旁边"还跟着一起压——所以
        # 另起一个目录把两者装在一起，下面压的就是这个目录。漏了这一步的话
        # zip 里只有 .app，那份手工插件谁也拿不到。
        run: |
          mkdir -p "dist/stage/plugin"
          cp -R "dist/$OUT.app" "dist/stage/"
          cp "plugin/PI_XpcTraffic.py" "dist/stage/plugin/"

      - name: 验包
        working-directory: ${{ matrix.component }}
        env:
          OUT: ${{ steps.names.outputs.output }}
        # opus 是 ctypes 运行时加载的，PyInstaller 的静态分析看不见；Info.plist
        # 里的麦克风说明少了会被 macOS 直接杀进程。两样都不会让打包失败，只会让
        # 用户拿到一个装上就用不了的包，所以在这里显式验一遍。
        run: |
          set -e
          APP="dist/$OUT.app"
          RES="$APP/Contents/Resources"
          missing=""
          [ -x "$APP/Contents/MacOS/$OUT" ] || missing="$missing 可执行文件"
          [ -f "$APP/Contents/Info.plist" ] || missing="$missing Info.plist"
          [ -f "$RES/buildinfo.json" ] || missing="$missing buildinfo.json"
          ls "$APP/Contents/Frameworks"/libopus*.dylib >/dev/null 2>&1 \
            || missing="$missing libopus.dylib"
          if [ "${{ matrix.component }}" != "atis" ]; then
            /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' \
              "$APP/Contents/Info.plist" >/dev/null \
              || missing="$missing NSMicrophoneUsageDescription"
          fi
          if [ "${{ matrix.component }}" = "xpc" ]; then
            [ -f "$RES/plugin/PI_XpcTraffic.py" ] || missing="$missing 包内的插件"
            [ -f "dist/stage/plugin/PI_XpcTraffic.py" ] || missing="$missing 包外的插件"
          fi
          if [ -n "$missing" ]; then echo "包里缺:$missing"; exit 1; fi

          # 签名必须是完整的。Apple 芯片上签名对不上的二进制根本不给运行，
          # 症状是双击毫无反应——比明确报错难查得多。
          codesign --verify --deep --strict "$APP"

          version=$(python -c "import json;print(json.load(open('$RES/buildinfo.json'))['version'])")
          if [ "$version" != "${{ needs.version.outputs.number }}" ]; then
            echo "包里的版本号是 $version，应当是 ${{ needs.version.outputs.number }}"
            exit 1
          fi
          echo "原生库齐全、签名有效，版本 $version"

      - name: 压包
        working-directory: ${{ matrix.component }}/dist
        env:
          OUT: ${{ steps.names.outputs.output }}
        # **必须用 ditto，不能用 zip。** .app 里有符号链接和代码签名，普通 zip
        # 压完解出来签名就废了，用户双击只会得到"应用已损坏"。
        #
        # xpc 压的是 stage/（.app 加上那份手工插件），另外两个直接压 .app——
        # 解开就是应用本身，少一层目录。
        run: |
          name="$OUT-macos-${{ matrix.arch.name }}-${{ needs.version.outputs.tag }}.zip"
          if [ "${{ matrix.component }}" = "xpc" ]; then
            mv stage "$OUT"
            ditto -c -k --sequesterRsrc --keepParent "$OUT" "$name"
          else
            ditto -c -k --sequesterRsrc --keepParent "$OUT.app" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.output }}-macos-${{ matrix.arch.name }}
          path: ${{ matrix.component }}/dist/*.zip
          if-no-files-found: error

  release:
    # 只有推到 main 才发。手动触发只出产物挂在 Actions 里，方便试包而不占版本号。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, test, test-macos, build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: 打标签
        # 标签是"已发布版本"的唯一事实来源，下一次就靠它算补丁号
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" \
                  -m "${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: packages/**/*.zip
          generate_release_notes: true
          body: |
            ## 下载哪个

            | 包 | 给谁用 | Windows | macOS |
            |---|---|---|---|
            | `audio-for-can` | 管制员：一栈频率，每个带 RX/TX/XC | ✅ | ✅ |
            | `atis-for-can` | 情报通播：自动取天气、中英双语播出 | ✅ | ✅ |
            | `xpc-for-can` | X-Plane 飞行员：语音 + FSD | ✅ | ✅ |
            | `msfs-for-can` | MSFS 飞行员：语音 + FSD | ✅ | — |

            `msfs-for-can` 没有 macOS 版，因为 Microsoft Flight Simulator 本身
            就没有 macOS 版。

            ### Windows

            解压后运行目录里的 exe。**不要**去 `build/` 里找同名的那个——
            那只是引导程序，缺 `_internal/` 里的运行库，双击会报
            "Failed to load Python DLL"。

            ### macOS

            按自己机器的芯片挑：**Apple 芯片（M1/M2/M3/M4）下 `-arm64`，
            Intel 下 `-x86_64`。** 拿错了打不开。不确定就看 关于本机 → 芯片。

            解压出来是一个 `.app`，拖进「应用程序」即可。

            **第一次打开会被拦下来**，说"无法打开，因为无法验证开发者"。
            这些包没有花钱买 Apple 开发者签名，所以：

            1. 双击一次（会被拒绝），
            2. 打开 系统设置 → 隐私与安全性，往下拉找到那条提示，
            3. 点「仍要打开」。

            只需要做这一次。

            还有两个权限，不给的话表现得像程序坏了而不是像没授权：

            - **麦克风**（管制端 / XPC）：第一次发话时会问，拒绝了就一直发不出声。
            - **辅助功能**（管制端 / XPC，键盘和鼠标侧键 PTT 要用）：**系统不会
              主动问**，要自己去 系统设置 → 隐私与安全性 → 辅助功能 里打开。
              没开的话 PTT 按下去完全没反应——设置里那一页会写明并给一个直达
              按钮。摇杆 PTT 不需要这个权限。

            配置和日志在 `~/Library/Application Support/<包名>/`，
            设置里的「打开日志」按钮会直接带你过去。

            ### X-Plane 的他机插件

            `xpc-for-can` 包里带了 `plugin/PI_XpcTraffic.py`。**一般不用管它**
            ——在客户端的 设置 → 他机 里点「安装插件」就行，它会自己找到
            X-Plane 目录并拷过去，之后重启 X-Plane 生效。

            那一份是留给自动安装不成的情况的（X-Plane 装在需要管理员权限的
            位置、绿色版探测不到目录），手工拷到

                <X-Plane>/Resources/plugins/PythonPlugins/PI_XpcTraffic.py

            插件要先装 XPPython3 才会被加载，**版本取决于模拟器**：X-Plane 12
            用 v4.x，X-Plane 11.52 用 v3.1.5（v4 是拿 SDK 420 编的，不兼容 XP11）。

            早期的纯语音飞行员端（`client` / `xplane_client`）不再出包，
            功能已并入 `xpc-for-can` 和 `msfs-for-can`。
